<!doctype html><html lang="vi"><meta charset="utf-8"><title>Limbo Telegram</title>
<style>body{font:16px Arial;max-width:520px;margin:40px auto;background:#102633;color:white}label{display:block;margin:18px 0}input{display:block;width:100%;padding:10px;box-sizing:border-box}button{padding:12px}p{line-height:1.5}</style>
<h1>Telegram · Số dư mỗi 3 phút</h1><p>Gửi số dư và loại tiền đang chọn trên trang Limbo. Giữ Chrome và ít nhất một tab Limbo mở. Mỗi chu kỳ chỉ gửi từ một tab.</p>
<label>Bot token<input id="token" type="password" autocomplete="off"></label><label>Chat ID<input id="chat" autocomplete="off"></label>
<label><input id="enabled" type="checkbox" style="display:inline;width:auto"> Bật gửi mỗi 3 phút</label><button id="save">Lưu cấu hình</button><p id="status"></p>
<p>Token lưu cục bộ trong tiện ích. Không gửi tin thử khi lưu.</p><script src="options.js"></script></html>
