<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Limbo · Telegram & Lịch sử</title><link rel="stylesheet" href="options.css">
<body><main><header><div class="brand">L</div><div><h1>Limbo</h1><span>Telegram & Lịch sử</span></div><span class="version" id="extensionVersion"></span></header>
<nav><button class="selected" id="settingsTab">Telegram</button><button id="historyTab">Lịch sử tab</button></nav>
<section id="settings"><div class="columns"><div><article><h2>Tên miền Stake</h2><label>Tên miền hoặc URL<input id="stakeDomain" placeholder="stake3094.com hoặc URL HTTPS"></label><button id="saveDomain" class="primary">Lưu tên miền</button><p id="domainStatus" role="status">Lưu rồi F5 tab Stake để kết nối.</p></article><article><h2>Kết nối Telegram</h2><label>Bot token<input id="token" type="password" autocomplete="off" placeholder="Token Telegram"></label><label>Chat ID<input id="chat" autocomplete="off" placeholder="Chat nhận tin"></label><label class="check"><input id="enabled" type="checkbox"> Bật thông báo</label></article>
<article><h2>Tùy chỉnh tin</h2><div class="pair"><label>Gửi mỗi (phút)<input id="interval" type="number" min="1" max="1440" step="1" value="3"></label><label>Số lẻ<select id="decimals"><option>0</option><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></label></div>
<div class="checks"><label class="check"><input type="checkbox" id="balance" checked> Số dư</label><label class="check"><input type="checkbox" id="tabs" checked> Số tab</label><label class="check"><input type="checkbox" id="volume" checked> Tổng cược</label><label class="check"><input type="checkbox" id="profit"> Lãi/lỗ</label><label class="check"><input type="checkbox" id="breakdown" checked> Phép cộng từng tab</label><label class="check"><input type="checkbox" id="currency"> Loại tiền</label><label class="check"><input type="checkbox" id="time" checked> Thời gian</label></div></article>
<button class="primary" id="save">Lưu cấu hình</button><p role="status" id="status"></p></div>
<aside><article><h2>Xem trước <small>Ví dụ</small></h2><pre id="preview"></pre><p class="hint">Tổng tính từ số gốc, rồi mới làm tròn.</p></article></aside></div></section>
<section id="history" hidden><div class="toolbar"><div><h2>Lịch sử tab</h2><p class="hint">Từ lúc bắt đầu ghi nhận · mới nhất trước</p></div><select id="filter"><option value="all">Tất cả</option><option value="open">Đang mở</option><option value="closed">Đã đóng</option></select><button id="refresh">Làm mới</button></div><div id="historyList"></div><p id="historyStatus" class="hint"></p></section>
</main><script src="domains.js"></script><script src="telegram-format.js"></script><script src="options.js"></script></body></html>
